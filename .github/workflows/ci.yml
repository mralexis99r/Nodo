name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nodo_test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: nodo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodo_test -d nodo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test server/tests/postgres.test.js
        env:
          TEST_DATABASE_URL: postgresql://nodo_test:test-only-ci-password@localhost:5432/nodo_test?sslmode=disable
